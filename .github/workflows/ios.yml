name: iOS IPA

# Builds the companion app on a GitHub-hosted macOS runner and publishes an
# unsigned IPA. The project is generated by XcodeGen, so the .xcodeproj is not
# in the repository; the workflow creates it first.
#
# The IPA is unsigned: it installs through a tool that re-signs with the user's
# own Apple ID (AltStore, Sideloadly) or after signing with a development
# certificate. Push notifications need a real provisioning profile, so they stay
# off in this build.

on:
  push:
    branches: [main]
    # Tag the commit to get a public download link on the release page.
    tags: ['ios-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: mobile/ios/OpenU60
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: mobile/ios/OpenU60
        run: |
          xcodebuild \
            -project OpenU60.xcodeproj \
            -scheme OpenU60 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package the IPA
        working-directory: mobile/ios/OpenU60
        run: |
          APP="build/Build/Products/Release-iphoneos/OpenU60.app"
          test -d "$APP" || { echo "app not found at $APP" >&2; exit 1; }
          rm -rf Payload OpenU60-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenU60-unsigned.ipa Payload
          ls -lh OpenU60-unsigned.ipa

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenU60-unsigned-ipa
          path: mobile/ios/OpenU60/OpenU60-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Tagged builds also get a stable, login-free URL:
      # https://github.com/<owner>/<repo>/releases/download/ios-v<version>/OpenU60-unsigned.ipa
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/ios/OpenU60/OpenU60-unsigned.ipa
          name: iOS ${{ github.ref_name }}
          body: |
            Unsigned IPA built from ${{ github.sha }}.

            It installs after re-signing with your own Apple ID — AltStore or
            Sideloadly do this on first install. Push notifications are not
            available without a provisioning profile.
